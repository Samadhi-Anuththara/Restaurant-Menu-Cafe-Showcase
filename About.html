<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Social Table</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #c6c6c6;
        }

        .navbar {
            width: 100%;
            height: 120px;
            background: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 80px;
            border-bottom: 5px solid #fff;
        }

        .logo img {
            height: 90px;
            width: auto;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 45px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #ff9d00;
        }
    </style>
</head>

<body>
<!--nav bar-->
    <nav class="navbar">
        <div class="logo">
            <img src="logo.png" alt="TukTuk Logo">
        </div>

        <ul class="nav-links">
            <li><a href="Home.html">Home</a></li>
            <li><a href="About.html">About</a></li>
            <li><a href="Manu.html">Menu</a></li>
            <li><a href="Gallery.html">Events</a></li>
            <li><a href="Contact.html">Contact</a></li>


        </ul>
    </nav>
<h1>About Page</h1>
</body>

</html>
